name: Verify desktop
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      installers:
        description: Also build unsigned installers (never publish)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev xvfb
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=moderate
      - run: npm run rebuild:native -w @knots/desktop
      - name: Runtime contracts and process-crash tests
        if: runner.os != 'Linux'
        run: npm run test:runtime -w @knots/desktop
      - name: Linux isolated runtime tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:runtime -w @knots/desktop -- --no-sandbox
      - run: npm run package:dir -w @knots/desktop
      - name: Packaged renderer/preload/SQLite smoke
        if: runner.os != 'Linux'
        run: npm run smoke:packaged -w @knots/desktop
      - name: Linux packaged smoke
        if: runner.os == 'Linux'
        env:
          KNOTS_CI_NO_SANDBOX: '1'
        run: xvfb-run -a npm run smoke:packaged -w @knots/desktop
      - name: Optional unsigned installers
        if: github.event_name == 'workflow_dispatch' && inputs.installers
        run: npm run dist -w @knots/desktop
      - name: Installer checksums
        if: github.event_name == 'workflow_dispatch' && inputs.installers
        run: npm run checksums -w @knots/desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knots-${{ runner.os }}-unsigned
          path: release/
          retention-days: 7
          if-no-files-found: error
