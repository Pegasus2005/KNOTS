<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>KNOTS · Bot studio</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./soft-theme.css" />
    <script type="module" src="./theme.js"></script>
    <script type="module" src="./studio.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>KNOTS</div>
        <a class="button quiet" href="./index.html">↗ Back to chat</a
        ><a class="button quiet" href="./studio.html" aria-current="page">✳ Bot studio</a
        ><button type="button" class="button quiet" data-theme-toggle>Theme</button>
        <div class="sidebar-foot">Your bots. Your models.</div>
      </aside>
      <main>
        <div class="studio-page">
          <header>
            <div class="studio-eyebrow">
              <span class="eyebrow">BOT STUDIO</span><span id="studio-summary" class="muted"></span>
            </div>
            <h1>Thoughtful bots. Better work.</h1>
            <p>Create, test and refine your bots in one calm workspace.</p>
          </header>
          <nav class="studio-tabs" aria-label="Studio">
            <a href="#create" data-tab="create">Create</a
            ><a href="#improve" data-tab="improve">Improve</a
            ><a href="#evaluate" data-tab="evaluate">Evaluate</a
            ><a href="#playbook" data-tab="playbook">Playbooks</a
            ><a href="#models" data-tab="models">Model auditions</a
            ><a href="#memory" data-tab="memory">Memory</a>
          </nav>
          <p id="studio-error" class="notice error" role="alert" hidden></p>
          <div class="studio-layout">
            <aside id="studio-list" class="studio-list" aria-label="Saved items"></aside>
            <section id="studio-detail" class="studio-detail" aria-live="polite"></section>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
